name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (Postgres, Auth, Storage)
        run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - name: Write test environment
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL)=')"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "EMAIL_PROVIDER=smtp"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=54325"
            echo "AI_PROVIDER=none"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
          } > .env.local
      - name: Integration tests (RLS, tenancy, workflows, payroll, ...)
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
