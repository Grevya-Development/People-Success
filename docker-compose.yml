# Runs the web app and the background worker against an existing Supabase
# project (hosted, or local via `npx supabase start`). Supply secrets in .env.
services:
  web:
    build: { context: ., target: web }
    env_file: .env
    ports: ["3100:3100"]
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    env_file: .env
    restart: unless-stopped
    depends_on: [web]
